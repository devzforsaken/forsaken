<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ScriptHub - Download Ready</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <i class="cloud c1"></i>
  <i class="cloud c2"></i>
  <i class="cloud c3"></i>

  <div class="hill"></div>
  <div class="road"></div>

  <i class="cube q1"></i>
  <i class="cube q2"></i>
  <i class="cube q3"></i>

  <span class="spark x1">✦</span>
  <span class="spark x2">✦</span>
  <span class="spark x3">✦</span>

  <header>
    <div class="brand">Script<b>Hub</b></div>
    <div class="badge">ACTIVE</div>
  </header>

  <main class="stage">
    <section class="card">
      <i class="tape t1"></i>
      <i class="tape t2"></i>
      <div class="content">
        <div class="game-icon">🎮</div>
        <h1>Script Hub</h1>
        <p class="sub">Loading your Roblox script downloader...</p>

        <div class="mini-row">
          <i></i><i></i><i></i><i></i><i></i>
        </div>

        <div class="count" id="count">3</div>

        <div class="progress">
          <span class="fill" id="fill"></span>
        </div>

        <p class="message" id="msg">Ready player...</p>

        <div class="small-tags">
          <span>GOD MODE</span>
          <span>AUTO FARM</span>
          <span>LUA EDITOR</span>
        </div>

        <button class="skip" id="skip">Skip countdown →</button>
      </div>
    </section>
  </main>

  <footer>SCRIPTHUB · ROBLOX SCRIPT LIBRARY</footer>

  <script src="script.js"></script>
</body>
</html>
